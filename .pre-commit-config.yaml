# Hooks for prek (https://github.com/j178/prek) or pre-commit: `prek install` sets up all three stages.
# The denylist is read from outside the repository (see kilotronic/checks/data-leak-check's README).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/kilotronic/checks
    rev: a6e8917fddb679077a2e8a427598ff1fd7a160ef # frozen: v1.0.0
    hooks:
      - id: git-identity # pre-commit: the identity git will stamp
        fail_fast: true
      - id: session-trailer # commit-msg: no Claude-Session trailer (public repo)
      - id: data-leak-check # pre-commit: staged changes and the commit's identity
      - id: data-leak-check-commit-msg # commit-msg: the message
      - id: data-leak-check-pre-push # pre-push: the commits being pushed
      - id: secret-scan # pre-commit: the staged changes (gitleaks)
      - id: secret-scan-push # pre-push: the commits being pushed (gitleaks)
      - id: ruff-format
      - id: prettier
      - id: shfmt
      - id: taplo-format
      - id: ruff-check
      - id: shellcheck
      - id: actionlint
      - id: markdownlint
      - id: yamllint
      - id: csv-lint
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: pinned
      - id: workflow-safety
      - id: non-root
