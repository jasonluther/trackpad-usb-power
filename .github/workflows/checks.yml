name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse private terms (the DATA_LEAK_DENYLIST secret) in this event's commits: added lines, file
  # paths, commit messages and authors. `data-leak-check` is a required check: keep the job name.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/data-leak-check@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Refuse secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog
  # (keys that still work).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/secret-scan@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0

  # Refuse placeholder and machine-default author identities, and Claude-Session trailers, in this
  # event's commits.
  git-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kilotronic/checks/git-identity@a6e8917fddb679077a2e8a427598ff1fd7a160ef # v1.0.0

  # The shared format and lint checks from .pre-commit-config.yaml (kilotronic/checks/lint's bundle, workflow
  # safety, pins). The identity, secret and private-data hooks are skipped here: the jobs above run them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: prek run --all-files
        env:
          SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
        run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure
